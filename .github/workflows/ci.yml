name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            backend:
              - 'backend/**'
              - 'packages/models/**'
            mobile:
              - 'mobile_app/**'
              - 'packages/**'
            web:
              - 'web_app/**'
              - 'packages/**'
            admin:
              - 'admin_panel/**'
              - 'packages/**'

  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: packages/models
      - run: dart analyze --no-fatal-warnings
        working-directory: packages/models
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: packages/api_client
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: packages/api_client

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: backend
      # Informational only: this repo has pre-existing formatting drift not
      # introduced by this change, so the check reports but doesn't block CI.
      - run: dart format --set-exit-if-changed .
        continue-on-error: true
        working-directory: backend
      - run: dart analyze --no-fatal-warnings
        working-directory: backend
      # No test suite exists yet (see final report) — dart test exits non-zero
      # on an empty suite, so this is informational until real tests land.
      - run: dart test
        continue-on-error: true
        working-directory: backend
      - run: dart compile exe bin/server.dart -o /tmp/orbit-backend
        working-directory: backend
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t orbit-backend:ci .

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: mobile_app
      # Informational only: this repo has pre-existing formatting drift not
      # introduced by this change, so the check reports but doesn't block CI.
      - run: dart format --set-exit-if-changed .
        continue-on-error: true
        working-directory: mobile_app
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: mobile_app
      - run: flutter test
        working-directory: mobile_app

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: web_app
      # Informational only: this repo has pre-existing formatting drift not
      # introduced by this change, so the check reports but doesn't block CI.
      - run: dart format --set-exit-if-changed .
        continue-on-error: true
        working-directory: web_app
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: web_app
      - run: flutter test
        working-directory: web_app
      - run: flutter build web --release
        working-directory: web_app

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: admin_panel
      # Informational only: this repo has pre-existing formatting drift not
      # introduced by this change, so the check reports but doesn't block CI.
      - run: dart format --set-exit-if-changed .
        continue-on-error: true
        working-directory: admin_panel
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: admin_panel
      - run: flutter test
        working-directory: admin_panel
      - run: flutter build web --release
        working-directory: admin_panel
