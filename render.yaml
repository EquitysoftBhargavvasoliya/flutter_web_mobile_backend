databases:
  - name: orbit-db
    databaseName: orbit_db
    user: orbit_admin
    plan: free

services:
  - type: web
    name: orbit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # Comma-separated allowed origins for the deployed web/admin apps, e.g.
      # https://example.com,https://admin.example.com — fill in after you know
      # the real domains. Render will prompt for this value on first deploy.
      - key: CORS_ORIGINS
        sync: false
