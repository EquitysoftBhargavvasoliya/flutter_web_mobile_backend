name: api_client
description: Shared Dio-based API client (auth header injection, typed error mapping, logging) for the Orbit Marketplace web, admin, and mobile apps.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.10.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  flutter_dotenv: ^6.0.1
  logger: ^2.7.0
  get: ^4.7.3
